name: Verify v10.0.5.19 adaptive CZM quality partition

on:
  pull_request:
    branches:
      - v10.0.5.17-paper-parameter-campaign-parity
  push:
    branches:
      - v10.0.5.17-v10227-four-class-j-diagnostics

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pandas matplotlib scipy
      - name: Compile adaptive partition path
        run: |
          python -m py_compile \
            arrhenius_fracture/adaptive_czm_quality_subdivision_v100518.py \
            arrhenius_fracture/adaptive_czm_quality_partition_v100519.py \
            arrhenius_fracture/mode_i_first_passage_v10_0_5_18_four_class_standalone.py \
            arrhenius_fracture/mode_i_first_passage_v10_0_5_19_four_class_standalone.py
      - name: Adaptive partition and production-sweep tests
        run: |
          python -m pytest -q \
            tests/test_adaptive_czm_quality_subdivision_v100518.py \
            tests/test_adaptive_czm_quality_partition_v100519.py \
            tests/test_v100519_four_class_temperature_sweep.py
      - name: Preserve stochastic moving-tip and adaptive-CZM parity
        run: |
          python -m pytest -q \
            tests/test_stochastic_hazard_event_length_v100516.py \
            tests/test_moving_tip_coupling_v100515.py \
            tests/test_adaptive_czm_tip_support_v1005144.py
      - name: Validate production launcher syntax
        run: |
          bash -n run_v10_0_5_19_frozen_four_class_temperature_sweep.sh
