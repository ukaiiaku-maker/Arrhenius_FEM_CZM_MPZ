name: Patch v10.0.5.17 macOS Bash compatibility

on:
  push:
    branches:
      - v10.0.5.17-paper-parameter-campaign-parity
    paths:
      - .github/workflows/patch_v100517_macos_bash.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v10.0.5.17-paper-parameter-campaign-parity
      - name: Replace empty Bash array and add regression test
        run: |
          python - <<'PY'
          from pathlib import Path

          runner = Path('run_v10_0_5_17_paper7_300_1200K_200um_stochastic_campaign.sh')
          text = runner.read_text()
          old_block = '''  PLOT_ARGS=()
            if [[ "$GENERATE_SOLVER_PLOTS" == "0" ]]; then
              PLOT_ARGS+=(--no-plots)
            fi
          '''
          new_block = '''  local PLOT_FLAG=""
            if [[ "$GENERATE_SOLVER_PLOTS" == "0" ]]; then
              PLOT_FLAG=--no-plots
            fi
          '''
          if old_block not in text:
              raise SystemExit('expected PLOT_ARGS block not found')
          text = text.replace(old_block, new_block, 1)
          old_expansion = '      "${PLOT_ARGS[@]}" \\\n'
          new_expansion = '      ${PLOT_FLAG:+$PLOT_FLAG} \\\n'
          if old_expansion not in text:
              raise SystemExit('expected PLOT_ARGS expansion not found')
          text = text.replace(old_expansion, new_expansion, 1)
          runner.write_text(text)

          test = Path('tests/test_runner_macos_bash_compat_v100517.py')
          test.write_text('''from pathlib import Path\n\n\ndef test_runner_avoids_empty_array_under_nounset():\n    text = Path(\"run_v10_0_5_17_paper7_300_1200K_200um_stochastic_campaign.sh\").read_text()\n    assert \"PLOT_ARGS\" not in text\n    assert 'local PLOT_FLAG=\"\"' in text\n    assert '${PLOT_FLAG:+$PLOT_FLAG}' in text\n\n\ndef test_optional_plot_flag_shell_semantics(tmp_path):\n    import subprocess\n    script = tmp_path / \"probe.sh\"\n    script.write_text(\"\"\"#!/usr/bin/env bash\nset -eu\nprobe() {\n  local mode=\"$1\"\n  local PLOT_FLAG=\"\"\n  if [[ \"$mode\" == \"0\" ]]; then PLOT_FLAG=--no-plots; fi\n  set -- before ${PLOT_FLAG:+$PLOT_FLAG} after\n  printf '%s\\n' \"$#:$*\"\n}\nprobe 1\nprobe 0\n\"\"\")\n    result = subprocess.run([\"bash\", str(script)], check=True, text=True, capture_output=True)\n    assert result.stdout.splitlines() == [\"2:before after\", \"3:before --no-plots after\"]\n''')

          workflow = Path('.github/workflows/verify_v100517_paper_parameter_campaign.yml')
          wtext = workflow.read_text()
          old = '      - name: Validate production runner syntax\n        run: bash -n run_v10_0_5_17_paper7_300_1200K_200um_stochastic_campaign.sh\n'
          new = '      - name: Validate production runner syntax and macOS Bash compatibility\n        run: |\n          bash -n run_v10_0_5_17_paper7_300_1200K_200um_stochastic_campaign.sh\n          python -m pytest -q --tb=short tests/test_runner_macos_bash_compat_v100517.py\n'
          if old not in wtext:
              raise SystemExit('expected workflow syntax step not found')
          workflow.write_text(wtext.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            run_v10_0_5_17_paper7_300_1200K_200um_stochastic_campaign.sh \
            tests/test_runner_macos_bash_compat_v100517.py \
            .github/workflows/verify_v100517_paper_parameter_campaign.yml
          git commit -m "Fix v10.0.5.17 runner for macOS Bash 3.2"
          git push origin HEAD:v10.0.5.17-paper-parameter-campaign-parity
