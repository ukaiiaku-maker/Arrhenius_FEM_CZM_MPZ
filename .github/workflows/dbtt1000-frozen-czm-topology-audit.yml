name: DBTT 1000 K frozen CZM topology audit

on:
  push:
    branches:
      - agent/dbtt1000-pf-fem-k-decomposition
    paths:
      - 'scripts/audit_dbtt1000_frozen_czm_topology.py'
      - '.github/workflows/dbtt1000-frozen-czm-topology-audit.yml'
  workflow_dispatch:

jobs:
  frozen-topology:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install solver dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy matplotlib
      - name: Run frozen elastic topology replay
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/audit_dbtt1000_frozen_czm_topology.py
      - name: Upload frozen topology audit
        uses: actions/upload-artifact@v4
        with:
          name: dbtt1000-frozen-czm-topology-audit
          path: dbtt1000_frozen_czm_topology_audit/
          if-no-files-found: error
