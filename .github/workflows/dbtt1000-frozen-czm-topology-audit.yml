name: DBTT 1000 K frozen CZM topology audit

on:
  push:
    branches:
      - agent/dbtt1000-pf-fem-k-decomposition
    paths:
      - 'scripts/audit_dbtt1000_frozen_czm_topology.py'
      - 'audit_inputs/dbtt1000_tip_only_event_lengths_m.json'
      - '.github/workflows/dbtt1000-frozen-czm-topology-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  frozen-topology:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install solver dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy matplotlib triangle
      - name: Run frozen elastic topology replay
        id: replay
        env:
          PYTHONPATH: ${{ github.workspace }}
        shell: bash
        run: |
          set +e
          mkdir -p dbtt1000_frozen_czm_topology_audit
          python scripts/audit_dbtt1000_frozen_czm_topology.py > dbtt1000_frozen_czm_topology_audit/run.log 2>&1
          rc=$?
          echo "$rc" > dbtt1000_frozen_czm_topology_audit/exit_code.txt
          cat dbtt1000_frozen_czm_topology_audit/run.log
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload frozen topology audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbtt1000-frozen-czm-topology-audit
          path: dbtt1000_frozen_czm_topology_audit/
          if-no-files-found: error
      - name: Persist audit result on diagnostic branch
        if: always()
        run: |
          set -euo pipefail
          rm -rf audit_results/dbtt1000_frozen_czm_topology
          mkdir -p audit_results
          cp -R dbtt1000_frozen_czm_topology_audit audit_results/dbtt1000_frozen_czm_topology
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit_results/dbtt1000_frozen_czm_topology
          if git diff --cached --quiet; then
            echo 'No audit-result changes to commit.'
          else
            git commit -m 'audit: record frozen DBTT CZM topology replay'
            git push origin HEAD:agent/dbtt1000-pf-fem-k-decomposition
          fi
      - name: Fail job if replay failed
        if: always()
        run: |
          test "${{ steps.replay.outputs.exit_code }}" = "0"
