name: Verify v10.0.5.18.3.9 atomic path corridor

on:
  push:
    branches:
      - v10.0.5.18.3.9-atomic-path-corridor-remesh
  pull_request:

jobs:
  focused-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Compile release
        run: |
          python -m py_compile \
            arrhenius_fracture/atomic_path_corridor_czm_v10051839.py \
            arrhenius_fracture/atomic_path_corridor_local_scale_v10051839.py \
            arrhenius_fracture/atomic_path_corridor_adaptive_quality_v10051839.py \
            arrhenius_fracture/atomic_path_corridor_quality_v10051839.py \
            arrhenius_fracture/mode_i_first_passage_v10_0_5_18_3_9_atomic_path_corridor.py \
            tests/test_atomic_path_corridor_v10051839.py \
            tests/test_atomic_path_corridor_node_compaction_v10051839.py
          bash -n run_v10_0_5_18_3_9_four_class_atomic_path_corridor.sh
      - name: Atomic corridor and node-state contracts
        run: |
          python -m pytest -q --tb=short \
            tests/test_atomic_path_corridor_v10051839.py \
            tests/test_atomic_path_corridor_node_compaction_v10051839.py
      - name: Inherited event and physics contracts
        run: |
          python -m pytest -q --tb=short \
            tests/test_numerical_resilience_v1005183.py \
            tests/test_stochastic_hazard_event_length_v100516.py \
            tests/test_joint_K_ramp_emission_v10051832.py \
            tests/test_joint_K_single_trial_v10051832.py \
            tests/test_stochastic_emission_v100518.py \
            tests/test_moving_tip_coupling_v100515.py \
            tests/test_pf_update_map_v100515.py \
            tests/test_signed_kernel_family_v1005141.py \
            tests/test_persistent_site_v100514.py \
            tests/test_adaptive_czm_tip_support_v1005144.py \
            tests/test_persistent_site_diagnostics_v1005144.py
      - name: Production-entry startup smoke
        run: |
          rm -rf /tmp/v10051839_smoke
          OPTIONS="v913_paper_weakT01_0129902_persistent_sites" \
          TEMPERATURES="300" \
          TARGET_EXT_UM=20 \
          STEPS=1 \
          MAX_JOBS=1 \
          PRINT_EVERY=1 \
          GENERATE_SOLVER_PLOTS=0 \
          SAVE_SNAPSHOTS=1 \
          SNAPSHOT_BY_EXT_UM=20 \
          CAMPAIGN_ROOT=/tmp/v10051839_smoke \
            bash run_v10_0_5_18_3_9_four_class_atomic_path_corridor.sh
          python - <<'PY'
          import json
          from pathlib import Path

          case = (
              Path('/tmp/v10051839_smoke')
              / 'v913_paper_weakT01_0129902_persistent_sites'
              / 'T0300K'
          )
          manifest = json.loads(
              (case / 'persistent_site_production_manifest_v10_0_5_18_3_9.json').read_text()
          )
          audit = json.loads(
              (case / 'atomic_path_corridor_audit_v10_0_5_18_3_9.json').read_text()
          )
          physics = manifest['physics_contract']
          assert physics['atomic_path_corridor_active'] is True
          assert physics['hazard_or_event_length_changed'] is False
          assert physics['area_gate_metric'] == 'new_triangle_area_over_equilateral_path_support_cell_area'
          assert physics['child_area_ratio_threshold_relaxed'] is False
          assert audit['atomic_target_aware_corridor_remesh'] is True
          assert audit['triangle_quality_floor_relaxed'] is False
          assert audit['child_area_ratio_floor_relaxed'] is False
          PY

  exact-seed-400um:
    needs: focused-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Run exact archived seed to 400 micrometres
        run: |
          set -o pipefail
          OUT=/tmp/v10051839_peak1000_seed3100913530_400um
          rm -rf "$OUT" /tmp/v10051839_exact.log
          OPTIONS="v913_paper_peak01_0242980_persistent_sites" \
          TEMPERATURES="1000" \
          THETA=30 \
          MIN_GLOBAL_FORWARD=0.05 \
          BASE_SEED=1720 \
          REPLICATE=0 \
          TARGET_EXT_UM=400 \
          STEPS=1000000 \
          MAX_JOBS=1 \
          SKIP_FINISHED=0 \
          PRINT_EVERY=10 \
          GENERATE_SOLVER_PLOTS=0 \
          SAVE_SNAPSHOTS=8 \
          SNAPSHOT_BY_EXT_UM=50 \
          ARRHENIUS_MIN_ACCEPTED_TRIANGLE_QUALITY=0.035 \
          ARRHENIUS_MIN_ACCEPTED_CHILD_AREA_RATIO=0.08 \
          ARRHENIUS_CORRIDOR_MAX_PATH_SUBSEGMENTS=16 \
          CLEAVAGE_EVENT_MIN_FACTOR=0.5 \
          CLEAVAGE_EVENT_MAX_FACTOR=4.0 \
          CAMPAIGN_ROOT="$OUT" \
            bash run_v10_0_5_18_3_9_four_class_atomic_path_corridor.sh \
            2>&1 | tee /tmp/v10051839_exact.log
      - name: Verify full exact-seed qualification
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('/tmp/v10051839_peak1000_seed3100913530_400um')
          case = root / 'v913_paper_peak01_0242980_persistent_sites' / 'T1000K'
          audit = json.loads(
              (case / 'atomic_path_corridor_audit_v10_0_5_18_3_9.json').read_text()
          )
          assert audit['run_completed_without_exception'] is True, audit.get('runtime_error')
          assert audit['failure_count'] == 0
          assert audit['event_count'] > 0
          assert audit['success_count'] == audit['event_count']
          compacted_event_count = 0
          for event in audit['events']:
              assert event['success'] is True
              assert event['endpoint_error_m'] <= max(1.0e-12, 1.0e-8 * event['requested_length_m'])
              assert event['length_error_m'] <= max(1.0e-12, 1.0e-8 * event['requested_length_m'])
              accepted = event['accepted_corridor']
              assert accepted['min_triangle_quality'] >= 0.035
              assert accepted['min_child_area_ratio'] >= 0.08
              assert accepted['area_gate_metric'] == 'new_triangle_area_over_equilateral_path_support_cell_area'
              certificate = accepted['quality_certificate']
              assert certificate['quality_floor_relaxed'] is False
              assert certificate['area_ratio_threshold_relaxed'] is False
              compacted_event_count += int(bool(certificate.get('node_compaction_applied')))

          # The archived long-growth path is known to retire at least one
          # superseded remesh node.  Qualification requires that compaction be
          # exercised, not merely available in an unvisited code path.
          assert compacted_event_count >= 1, compacted_event_count

          geom = json.loads(
              (case / 'stochastic_geometry_events_v10_0_5_16.json').read_text()
          )
          rows = geom if isinstance(geom, list) else next(
              geom[key] for key in ('events', 'geometry_events', 'records')
              if isinstance(geom.get(key), list)
          )
          moved = sum(float(row.get('moved_m', 0.0) or 0.0) for row in rows if row.get('inserted'))
          assert moved >= 400.0e-6, moved

          log = Path('/tmp/v10051839_exact.log').read_text()
          assert 'seed=3100913530' in log
          assert '[DONE]' in log
          print(
              f'Qualified exact seed with {audit["event_count"]} events, '
              f'{compacted_event_count} compacted events, and {1e6*moved:.3f} um growth'
          )
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v10051839-exact-seed-qualification
          path: |
            /tmp/v10051839_exact.log
            /tmp/v10051839_peak1000_seed3100913530_400um
          retention-days: 14
