name: DBTT frozen CZM topology micro5
on:
  push:
    branches: [agent/dbtt1000-frozen-topology-micro5]
    paths:
      - 'scripts/audit_dbtt1000_frozen_czm_topology_micro5.py'
      - '.github/workflows/dbtt1000-frozen-czm-topology-micro5.yml'
permissions:
  contents: write
jobs:
  micro5:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy scipy matplotlib triangle
      - name: Run microgate
        id: replay
        env: {PYTHONPATH: '${{ github.workspace }}'}
        run: |
          set +e
          mkdir -p dbtt1000_frozen_czm_topology_micro5
          python scripts/audit_dbtt1000_frozen_czm_topology_micro5.py > dbtt1000_frozen_czm_topology_micro5/run.log 2>&1
          rc=$?
          echo "$rc" > dbtt1000_frozen_czm_topology_micro5/exit_code.txt
          cat dbtt1000_frozen_czm_topology_micro5/run.log
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Persist result
        if: always()
        run: |
          set -euo pipefail
          rm -rf audit_results/dbtt1000_frozen_czm_topology_micro5
          cp -R dbtt1000_frozen_czm_topology_micro5 audit_results/dbtt1000_frozen_czm_topology_micro5
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit_results/dbtt1000_frozen_czm_topology_micro5
          git commit -m 'audit: record isolated DBTT frozen topology micro5'
          git push origin HEAD:agent/dbtt1000-frozen-topology-micro5
      - name: Fail on replay error
        if: always()
        run: test "${{ steps.replay.outputs.exit_code }}" = "0"
