name: Verify v10.0.5.18.3.3 target-aware long-growth corridor

on:
  push:
    branches:
      - v10.0.5.18.3.3-long-growth-corridor-target
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Compile point release and production tooling
        run: |
          python -m py_compile \
            arrhenius_fracture/long_growth_corridor_v10051833.py \
            arrhenius_fracture/mode_i_first_passage_v10_0_5_18_3_3_four_class_long_growth_corridor.py \
            scripts/audit_v10051833_four_class_14T_400um_sweep.py
          bash -n run_v10_0_5_18_3_3_four_class_focused_long_growth.sh
          bash -n run_v10_0_5_18_3_3_four_class_14T_400um_target_corridor_sweep.sh
          python scripts/audit_v10051833_four_class_14T_400um_sweep.py --help >/dev/null
      - name: Full 1000 um corridor and 400 um sweep contracts
        run: |
          /usr/bin/time -v python -m pytest -q --tb=short \
            tests/test_long_growth_corridor_v10051833.py
      - name: Preserve joint-K single-trial stochastic kinetics
        run: |
          python -m pytest -q --tb=short \
            tests/test_joint_K_ramp_emission_v10051832.py \
            tests/test_joint_K_single_trial_v10051832.py
      - name: Preserve moving-tip, signed-source, and adaptive-CZM contracts
        run: |
          python -m pytest -q --tb=short \
            tests/test_numerical_resilience_v1005183.py \
            tests/test_stochastic_emission_v100518.py \
            tests/test_stochastic_hazard_event_length_v100516.py \
            tests/test_moving_tip_coupling_v100515.py \
            tests/test_pf_update_map_v100515.py \
            tests/test_signed_kernel_family_v1005141.py \
            tests/test_persistent_site_v100514.py \
            tests/test_adaptive_czm_tip_support_v1005144.py \
            tests/test_persistent_site_diagnostics_v1005144.py
