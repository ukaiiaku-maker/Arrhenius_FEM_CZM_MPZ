name: DBTT 1000 K frozen CZM topology short100

on:
  push:
    branches:
      - agent/dbtt1000-frozen-topology-audit-run
    paths:
      - 'scripts/audit_dbtt1000_frozen_czm_topology.py'
      - 'scripts/audit_dbtt1000_frozen_czm_topology_short100.py'
      - 'audit_inputs/dbtt1000_tip_only_event_lengths_m.json'
      - '.github/workflows/dbtt1000-frozen-czm-topology-short100.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  short100:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy scipy matplotlib triangle
      - name: Run 100 um gate
        id: replay
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set +e
          mkdir -p dbtt1000_frozen_czm_topology_short100
          python scripts/audit_dbtt1000_frozen_czm_topology_short100.py > dbtt1000_frozen_czm_topology_short100/run.log 2>&1
          rc=$?
          echo "$rc" > dbtt1000_frozen_czm_topology_short100/exit_code.txt
          cat dbtt1000_frozen_czm_topology_short100/run.log
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Persist result
        if: always()
        run: |
          set -euo pipefail
          rm -rf audit_results/dbtt1000_frozen_czm_topology_short100
          cp -R dbtt1000_frozen_czm_topology_short100 audit_results/dbtt1000_frozen_czm_topology_short100
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit_results/dbtt1000_frozen_czm_topology_short100
          git commit -m 'audit: record isolated 100 um frozen DBTT topology gate'
          git push origin HEAD:agent/dbtt1000-frozen-topology-audit-run
      - name: Fail on replay error
        if: always()
        run: test "${{ steps.replay.outputs.exit_code }}" = "0"
