name: Verify v10.0.5.16 stochastic hazard and event-length parity

on:
  push:
    branches:
      - v10.0.5.16-stochastic-hazard-event-length-parity
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -q -e '.[dev]'
      - name: Compile v10.0.5.16
        run: |
          python -m py_compile \
            arrhenius_fracture/persistent_site_stochastic_tip_v100516.py \
            arrhenius_fracture/stochastic_geometry_v100516.py \
            arrhenius_fracture/persistent_site_diagnostics_v100516.py \
            arrhenius_fracture/refinement_audit_v100516.py \
            arrhenius_fracture/mode_i_first_passage_v10_0_5_16_stochastic_pf_parity.py
      - name: Stochastic hazard and event-length tests
        run: python -m pytest -q --tb=short tests/test_stochastic_hazard_event_length_v100516.py
      - name: Diagnostics and refinement lifecycle tests
        run: python -m pytest -q --tb=short tests/test_diagnostics_refinement_v100516.py
      - name: Preserve exact PF update-map and moving-tip parity
        run: |
          python -m pytest -q --tb=short \
            tests/test_pf_update_map_v100515.py \
            tests/test_moving_tip_coupling_v100515.py
      - name: Persistent source and kernel-family contracts
        run: |
          python -m pytest -q --tb=short \
            tests/test_signed_kernel_family_v1005141.py \
            tests/test_persistent_site_v100514.py
      - name: Adaptive-CZM and inherited mechanics regressions
        run: |
          python -m pytest -q --tb=short \
            tests/test_adaptive_czm_tip_support_v1005144.py \
            tests/test_persistent_site_diagnostics_v1005144.py \
            tests/test_v100513_barrier_only.py \
            tests/test_v1005131_preserved_state.py \
            tests/test_v1005132_startup_resolution_warning.py \
            tests/test_v1005133_tip_only_ramp.py \
            tests/test_v1005134_tip_only_policy_propagation.py \
            tests/test_v1005135_long_corridor.py \
            tests/test_v1005123_phase_c_repairs.py \
            tests/test_mpz_v9_10_unified_transport.py \
            tests/test_v100510_refinement_support.py \
            tests/test_v100511_same_mesh_energy.py
      - name: Validate stochastic runner syntax
        run: bash -n run_v10_0_5_16_0118_300_1200K_200um_stochastic_family_campaign.sh
