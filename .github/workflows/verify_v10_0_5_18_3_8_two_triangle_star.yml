name: Verify v10.0.5.18.3.8 constrained endpoint star

on:
  push:
    branches:
      - v10.0.5.18.3.8-two-triangle-cavity-retriangulation
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Compile constrained endpoint-star release
        run: |
          python -m py_compile \
            arrhenius_fracture/quality_aware_czm_retry_v10051835.py \
            arrhenius_fracture/event_resolved_czm_retry_v10051837.py \
            arrhenius_fracture/quality_aware_czm_two_triangle_star_v10051838.py \
            arrhenius_fracture/mode_i_first_passage_v10_0_5_18_3_8_two_triangle_star.py \
            tests/test_event_resolved_mesh_handoff_v10051838.py \
            tests/test_two_triangle_star_v10051838.py
          bash -n run_v10_0_5_18_3_8_four_class_two_triangle_star.sh
      - name: Constrained endpoint-star and mesh-handoff contracts
        run: |
          python -m pytest -q --tb=short \
            tests/test_event_resolved_mesh_handoff_v10051838.py \
            tests/test_two_triangle_star_v10051838.py \
            tests/test_two_triangle_cavity_v10051838.py
      - name: Inherited event-resolved geometry contracts
        run: |
          python -m pytest -q --tb=short \
            tests/test_event_resolved_czm_edge_connected_v10051837.py \
            tests/test_event_resolved_czm_retry_v10051837.py \
            tests/test_committed_tip_resolution_audit_v10051836.py \
            tests/test_numerical_resilience_v1005183.py \
            tests/test_stochastic_hazard_event_length_v100516.py \
            -k 'not test_runner_and_package_contracts'
      - name: Actual constrained-star production-entry startup smoke
        run: |
          rm -rf /tmp/v10051838_star_smoke
          OPTIONS="v913_paper_weakT01_0129902_persistent_sites" \
          TEMPERATURES="300" \
          TARGET_EXT_UM=20 \
          STEPS=1 \
          MAX_JOBS=1 \
          PRINT_EVERY=1 \
          GENERATE_SOLVER_PLOTS=0 \
          SAVE_SNAPSHOTS=1 \
          SNAPSHOT_BY_EXT_UM=20 \
          CAMPAIGN_ROOT=/tmp/v10051838_star_smoke \
            bash run_v10_0_5_18_3_8_four_class_two_triangle_star.sh
          python - <<'PY'
          import json
          from pathlib import Path

          case = (
              Path('/tmp/v10051838_star_smoke')
              / 'v913_paper_weakT01_0129902_persistent_sites'
              / 'T0300K'
          )
          manifest = json.loads(
              (case / 'persistent_site_production_manifest_v10_0_5_18_3_8.json').read_text()
          )
          retry = json.loads(
              (case / 'event_resolved_czm_retry_v10_0_5_18_3_8.json').read_text()
          )
          assert manifest['two_triangle_constrained_endpoint_star_active'] is True
          assert manifest['triangle_quality_floor_relaxed'] is False
          assert manifest['constitutive_physics_changed'] is False
          assert retry['two_triangle_constrained_endpoint_star_active'] is True
          assert retry['mesh_only_refinement_handoff_restart'] is True
          assert retry['mesh_only_handoff_consumes_physical_length'] is False
          PY
      - name: Preserve inherited physics
        run: |
          python -m pytest -q --tb=short \
            tests/test_joint_K_ramp_emission_v10051832.py \
            tests/test_joint_K_single_trial_v10051832.py \
            tests/test_stochastic_emission_v100518.py \
            tests/test_moving_tip_coupling_v100515.py \
            tests/test_pf_update_map_v100515.py \
            tests/test_signed_kernel_family_v1005141.py \
            tests/test_persistent_site_v100514.py \
            tests/test_adaptive_czm_tip_support_v1005144.py \
            tests/test_persistent_site_diagnostics_v1005144.py
