name: DBTT 1000 K frozen CZM compliance audit

on:
  push:
    branches:
      - agent/dbtt1000-pf-fem-k-decomposition
    paths:
      - 'scripts/audit_dbtt1000_frozen_czm_compliance.py'
      - 'reference_inputs/dbtt1000_frozen_audit/event_geometry_projected.json'
      - '.github/workflows/dbtt1000-frozen-czm-compliance-audit.yml'
  workflow_dispatch:

jobs:
  frozen-compliance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy matplotlib
      - name: Run frozen adaptive-CZM mechanics replay
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/audit_dbtt1000_frozen_czm_compliance.py
      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: dbtt1000-frozen-czm-compliance-audit
          path: dbtt1000_frozen_czm_compliance_audit/
          if-no-files-found: error
