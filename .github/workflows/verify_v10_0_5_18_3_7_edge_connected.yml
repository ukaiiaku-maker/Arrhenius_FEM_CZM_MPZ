name: Verify v10.0.5.18.3.7 edge-connected endpoint routing

on:
  pull_request:
    branches:
      - v10.0.5.18.3.6-committed-tip-resolution-audit
  push:
    branches:
      - v10.0.5.18.3.7-event-resolved-local-cavity-refinement

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Compile edge-connected overlay
        run: |
          python -m py_compile \
            arrhenius_fracture/mode_i_first_passage_v10_0_5_18_3_7_event_resolved_edge_connected.py \
            tests/test_event_resolved_czm_edge_connected_v10051837.py
          bash -n run_v10_0_5_18_3_7_four_class_event_resolved_edge_connected.sh
      - name: Edge-connected and archived geometry contracts
        run: |
          python -m pytest -q --tb=short \
            tests/test_event_resolved_czm_edge_connected_v10051837.py \
            tests/test_event_resolved_czm_retry_v10051837.py \
            tests/test_committed_tip_resolution_audit_v10051836.py \
            tests/test_numerical_resilience_v1005183.py \
            tests/test_stochastic_hazard_event_length_v100516.py
      - name: Preserve path-aware envelope contracts
        run: |
          python -m pytest -q --tb=short \
            tests/test_path_aware_growth_envelope_v10051834.py \
            -k 'not test_runner_and_package_contracts'
      - name: Actual edge-connected production-entry startup smoke
        run: |
          rm -rf /tmp/v10051837_edge_connected_smoke
          OPTIONS="v913_paper_weakT01_0129902_persistent_sites" \
          TEMPERATURES="300" \
          TARGET_EXT_UM=20 \
          STEPS=1 \
          MAX_JOBS=1 \
          PRINT_EVERY=1 \
          GENERATE_SOLVER_PLOTS=0 \
          SAVE_SNAPSHOTS=1 \
          SNAPSHOT_BY_EXT_UM=20 \
          CAMPAIGN_ROOT=/tmp/v10051837_edge_connected_smoke \
            bash run_v10_0_5_18_3_7_four_class_event_resolved_edge_connected.sh
          python - <<'PY'
          import json
          from pathlib import Path

          case = (
              Path('/tmp/v10051837_edge_connected_smoke')
              / 'v913_paper_weakT01_0129902_persistent_sites'
              / 'T0300K'
          )
          manifest = json.loads(
              (case / 'persistent_site_production_manifest_v10_0_5_18_3_7.json').read_text()
          )
          retry = json.loads(
              (case / 'event_resolved_czm_retry_v10_0_5_18_3_7.json').read_text()
          )
          resolution = json.loads(
              (case / 'committed_tip_resolution_audit_v10_0_5_18_3_7.json').read_text()
          )
          assert manifest['physics_contract'][
              'direct_endpoint_refinement_requires_tip_fan_shared_edge'
          ] is True
          assert manifest['physics_contract'][
              'one_node_target_cavity_routes_to_exact_ray_crossing'
          ] is True
          assert manifest['physics_contract'][
              'committed_tip_telemetry_recorded_at_strict_wrapper'
          ] is True
          assert retry['minimum_tip_fan_shared_node_count_for_direct_endpoint'] == 2
          assert retry['equal_length_partition_retry'] is False
          assert resolution['committed_tip_telemetry_recorded_at_strict_wrapper'] is True
          PY
      - name: Preserve inherited physics
        run: |
          python -m pytest -q --tb=short \
            tests/test_joint_K_ramp_emission_v10051832.py \
            tests/test_joint_K_single_trial_v10051832.py \
            tests/test_stochastic_emission_v100518.py \
            tests/test_moving_tip_coupling_v100515.py \
            tests/test_pf_update_map_v100515.py \
            tests/test_signed_kernel_family_v1005141.py \
            tests/test_persistent_site_v100514.py \
            tests/test_adaptive_czm_tip_support_v1005144.py \
            tests/test_persistent_site_diagnostics_v1005144.py
