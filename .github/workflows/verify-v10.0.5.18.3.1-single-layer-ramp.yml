name: Verify v10.0.5.18.3.1 single-layer load ramp

on:
  push:
    branches:
      - v10.0.5.18.3.1-single-layer-local-ramp
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e .
      - name: Compile point release
        run: |
          python -m py_compile \
            arrhenius_fracture/persistent_site_load_ramp_stochastic_emission_v10051831.py \
            arrhenius_fracture/mode_i_first_passage_v10_0_5_18_3_1_four_class_single_layer_load_ramp_stochastic_emission.py
          bash -n run_v10_0_5_18_3_1_four_class_focused_100um.sh
      - name: Single-layer load-ramp regressions
        run: |
          python -m pytest -q --tb=short \
            tests/test_single_layer_load_ramp_v10051831.py \
            tests/test_v10051831_runner_contract.py
      - name: Preserve v10.0.5.18.3 load-ramp and resilience contracts
        run: |
          python -m pytest -q --tb=short \
            tests/test_load_ramp_stochastic_emission_v1005183.py \
            tests/test_numerical_resilience_v1005183.py \
            tests/test_v1005183_runner_contract.py
      - name: Preserve stochastic moving-tip and signed-source contracts
        run: |
          python -m pytest -q --tb=short \
            tests/test_stochastic_emission_v100518.py \
            tests/test_stochastic_hazard_event_length_v100516.py \
            tests/test_moving_tip_coupling_v100515.py \
            tests/test_pf_update_map_v100515.py \
            tests/test_signed_kernel_family_v1005141.py \
            tests/test_persistent_site_v100514.py \
            tests/test_adaptive_czm_tip_support_v1005144.py \
            tests/test_persistent_site_diagnostics_v1005144.py
