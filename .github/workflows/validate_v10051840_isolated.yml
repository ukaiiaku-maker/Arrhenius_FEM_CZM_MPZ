name: isolated-v10.0.5.18.4.0-validation

on:
  push:
    branches:
      - v10.0.5.18.4.0-theta0-pf-parity-validation

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Focused and inherited tests
        run: |
          python -m py_compile \
            arrhenius_fracture/bulk_pt_detailed_balance_v1041_exact.py \
            arrhenius_fracture/refinement_audit_v100516.py \
            arrhenius_fracture/mode_i_first_passage_v9_18_5_3.py \
            arrhenius_fracture/theta0_pf_full_field_metadata_v10051840.py \
            arrhenius_fracture/mode_i_first_passage_v10_0_5_18_4_0_theta0_pf_full_field_parity.py \
            arrhenius_fracture/mode_i_first_passage_v10_0_5_18_4_0_theta0_pf_full_field_production.py \
            scripts/compare_v10051840_theta0_pf_parity.py
          bash -n run_v10_0_5_18_4_0_peak1000_theta0_pf_full_field_parity.sh
          pytest -q \
            tests/test_theta0_pf_parity_v10051840.py \
            tests/test_theta0_pf_full_field_parity_v10051840.py \
            tests/test_theta0_pf_full_field_metadata_v10051840.py \
            tests/test_corridor_refinement_metadata_v10051840.py \
            tests/test_atomic_path_corridor_v10051839.py \
            tests/test_atomic_path_corridor_node_compaction_v10051839.py
      - name: Real one-step full-field production smoke
        env:
          CLEAVAGE_HAZARD_MODE: exponential
          CLEAVAGE_HAZARD_SEED: "8666"
          CLEAVAGE_HAZARD_MIN_THRESHOLD: "1e-12"
          CLEAVAGE_EVENT_LENGTH_MODE: threshold_scaled
          CLEAVAGE_EVENT_MIN_FACTOR: "0.5"
          CLEAVAGE_EVENT_MAX_FACTOR: "4.0"
          EMISSION_HAZARD_SEED: "8666"
          EMISSION_HAZARD_MIN_THRESHOLD: "1e-12"
          EMISSION_MAX_ACTION_SUBSTEP: "0.05"
          EMISSION_MAX_EVENTS_PER_HALF_STEP: "10000"
          EMISSION_RAMP_MAX_LOG_RATE_CHANGE: "0.25"
          EMISSION_RAMP_ACTION_FLOOR: "1e-6"
          EMISSION_INNER_MAX_LOG_HAZARD_CHANGE: "0.25"
          EMISSION_INNER_ACTION_FLOOR: "1e-6"
          EMISSION_EVENT_HORIZON_FACTOR: "1.25"
          EMISSION_INNER_MAX_REFINEMENTS: "24"
          TWO_CHANNEL_PROBE_FALLBACK_MAX_CALLS: "8"
          ARRHENIUS_COMMITTED_TARGET_EXTENSION_UM: "20"
          ARRHENIUS_MIN_ACCEPTED_TRIANGLE_QUALITY: "0.035"
          ARRHENIUS_MIN_ACCEPTED_CHILD_AREA_RATIO: "0.08"
          ARRHENIUS_CORRIDOR_MAX_PATH_SUBSEGMENTS: "16"
        run: |
          rm -rf /tmp/v10051840_full_field_smoke
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          from arrhenius_fracture import mode_i_first_passage_v10_0_5_18_4_0_theta0_pf_parity as control
          from arrhenius_fracture import mode_i_first_passage_v10_0_5_18_4_0_theta0_pf_full_field_production as production

          root = Path.cwd()
          family = root / 'runtime_inputs/v10_0_5_17_frozen_pf_inputs/signed_kernel/v10_2_14_active_only_campaign_family.json'
          control.REFERENCE_KERNEL_SHA256 = hashlib.sha256(family.read_bytes()).hexdigest()
          out = Path('/tmp/v10051840_full_field_smoke')
          production.main([
              '--parameter-source-root', str(root / 'runtime_inputs/v10_0_5_18_four_class'),
              '--parameter-option', control.REFERENCE_OPTION,
              '--signed-kernel-family', str(family),
              '--tip-refinement-radius-um', '330',
              '--selected-cluster-J-outer-um', '240',
              '--local-J-outer-um', '100',
              '--mode', '2d', '--bulk-plasticity-mode', 'full_field',
              '--temperatures', '1000', '--steps', '1',
              '--nx', '36', '--ny', '72',
              '--tip-h-fine', '1e-6', '--tip-ratio', '1.20',
              '--dU', '2e-7', '--dt', '8.4', '--n-stagger', '2',
              '--print-every', '1', '--adaptive-events',
              '--adaptive-event-target', '0.15',
              '--adaptive-min-frac', '1e-8', '--adaptive-grow', '4',
              '--da-phys', '5e-6', '--target-crack-extension-um', '20',
              '--crystal-aniso', '--crystal-compete', '--crystal-theta-deg', '0',
              '--min-global-forward', '0.05',
              '--crystal-C11', '523e9', '--crystal-C12', '203e9', '--crystal-C44', '160e9',
              '--cleave-gamma-aniso', '0.3', '--crystal-material', 'w',
              '--max-fronts', '1', '--crack-backend', 'adaptive_czm',
              '--czm-max-angle-error-deg', '35', '--j-decomposition', 'cluster',
              '--mpz-length-um', '50', '--mpz-n-bins', '80',
              '--save-snapshots', '1', '--snapshot-cols', '1',
              '--snapshot-by-crack-extension-um', '20', '--no-plots',
              '--out', str(out),
          ])

          audit = json.loads((out / production.AUDIT_FILE).read_text())
          assert audit['run_completed_without_exception'] is True, audit.get('runtime_error')
          assert audit['bulk_parity']['FEM_bulk_plasticity_mode'] == 'full_field'
          assert audit['bulk_parity']['detailed_balance_forward_minus_reverse'] is True

          manifest = json.loads((out / 'persistent_site_production_manifest_v10_0_5_18_3_9.json').read_text())
          assert manifest['theta0_pf_full_field_parity']['bulk_parity']['model'] == 'v10.4.1_bulk_peierls_taylor_detailed_balance_exact_port'
          assert manifest['crystal_theta_deg'] == 0.0
          assert manifest['bulk_state_evolves_in_fem'] is True
          assert manifest['bulk_plasticity_semantic_mode'] == 'full_field'
          lifecycle = manifest['refinement_metadata_lifecycle_audit']
          assert lifecycle['captured_mesh_has_refinement_metadata'] is True
          assert lifecycle['production_refinement_radius_m'] >= 330.0e-6

          summary = json.loads((out / 'summary.json').read_text())[0]
          assert summary['crystal_theta_deg'] == 0.0
          assert summary['material_class'] == 'peak'
          assert summary['bulk_state_evolves_in_fem'] is True
          assert summary['taylor_renewal_time_s'] == 1.0e-9

          metadata = json.loads((out / production.METADATA_AUDIT_FILE).read_text())
          assert metadata['metadata_only'] is True
          assert metadata['physics_or_mesh_modified'] is False
          print('isolated full-field production smoke passed')
          PY
