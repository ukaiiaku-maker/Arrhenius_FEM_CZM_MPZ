name: Verify v10.0.5.18.3.5 quality-aware CZM retry

on:
  push:
    branches:
      - v10.0.5.18.3.5-quality-aware-czm-retry
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Compile point release and production tooling
        run: |
          python -m py_compile \
            arrhenius_fracture/quality_aware_czm_patch_v10051835.py \
            arrhenius_fracture/quality_aware_czm_retry_v10051835.py \
            arrhenius_fracture/mode_i_first_passage_v10_0_5_18_3_5_four_class_quality_aware_czm_retry.py \
            tests/test_quality_aware_czm_retry_v10051835.py
          bash -n run_v10_0_5_18_3_5_four_class_focused_long_growth.sh
          bash -n run_v10_0_5_18_3_5_four_class_14T_400um_quality_aware_sweep.sh
      - name: Quality-aware transaction contracts
        run: |
          python -m pytest -q --tb=short \
            tests/test_quality_aware_czm_retry_v10051835.py \
            tests/test_numerical_resilience_v1005183.py
      - name: Preserve substantive path-aware envelope contracts
        run: |
          /usr/bin/time -v python -m pytest -q --tb=short \
            tests/test_path_aware_growth_envelope_v10051834.py \
            -k 'not test_runner_and_package_contracts'
      - name: Actual production-entry startup smoke
        run: |
          rm -rf /tmp/v10051835_production_smoke
          OPTIONS="v913_paper_weakT01_0129902_persistent_sites" \
          TEMPERATURES="300" \
          TARGET_EXT_UM=20 \
          STEPS=1 \
          MAX_JOBS=1 \
          PRINT_EVERY=1 \
          GENERATE_SOLVER_PLOTS=0 \
          SAVE_SNAPSHOTS=1 \
          SNAPSHOT_BY_EXT_UM=20 \
          CAMPAIGN_ROOT=/tmp/v10051835_production_smoke \
            bash run_v10_0_5_18_3_5_four_class_focused_long_growth.sh
          python - <<'PY'
          import json
          from pathlib import Path

          case = (
              Path("/tmp/v10051835_production_smoke")
              / "v913_paper_weakT01_0129902_persistent_sites"
              / "T0300K"
          )
          manifest = json.loads(
              (case / "persistent_site_production_manifest_v10_0_5_18_3_5.json").read_text()
          )
          corridor = json.loads(
              (case / "compact_corridor_mesh_v91852.json").read_text()
          )
          retry = json.loads(
              (case / "quality_aware_czm_retry_v10_0_5_18_3_5.json").read_text()
          )
          assert manifest["point_release"] == "10.0.5.18.3.5"
          assert manifest["run_completed_without_exception"] is True
          physics = manifest["physics_contract"]
          assert physics["quality_gate_evaluated_inside_retry_transaction"] is True
          assert physics["triangle_quality_floor_relaxed"] is False
          assert physics["child_area_ratio_floor_relaxed"] is False
          assert corridor["path_aware_growth_envelope"] is True
          assert corridor["maximum_sampled_hbar_tip_over_L_pz"] <= 0.25
          assert corridor["minimum_initial_triangle_quality"] >= 0.035
          assert retry["quality_gate_inside_retry_transaction"] is True
          assert retry["run_completed_without_exception"] is True
          PY
      - name: Preserve joint-K and moving-tip physics
        run: |
          python -m pytest -q --tb=short \
            tests/test_joint_K_ramp_emission_v10051832.py \
            tests/test_joint_K_single_trial_v10051832.py \
            tests/test_stochastic_emission_v100518.py \
            tests/test_stochastic_hazard_event_length_v100516.py \
            tests/test_moving_tip_coupling_v100515.py \
            tests/test_pf_update_map_v100515.py \
            tests/test_signed_kernel_family_v1005141.py \
            tests/test_persistent_site_v100514.py \
            tests/test_adaptive_czm_tip_support_v1005144.py \
            tests/test_persistent_site_diagnostics_v1005144.py
