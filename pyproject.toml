[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arrhenius-fem-czm"
version = "10.0.5.18.4.0"
description = "Full 2-D Arrhenius FEM/CZM with exact four-class transfer, stochastic cleavage and signed emission, atomic target-aware constrained path-corridor CZM remeshing, and a hard-locked theta-zero PF v10.4.1 numerical parity control"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "pandas>=2.0",
  "triangle==20250106",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[tool.setuptools.packages.find]
include = ["arrhenius_fracture*"]

[tool.setuptools.package-data]
arrhenius_fracture = [
  "data/mpz_v9_11_1/*.json",
  "data/mpz_v10_0_5_14/*.csv",
  "data/mpz_v10_0_5_14/*.json",
]
